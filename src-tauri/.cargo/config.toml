# This machine has two Visual Studio installations (a "VS 18 Community"
# with an incomplete C++ toolset, and a fully-installed "VS 2022 BuildTools").
# rustc's own MSVC auto-detection picks the newer-numbered one regardless of
# which is actually complete, which fails linking with:
#   LINK : fatal error LNK1104: cannot open file 'msvcrt.lib'
#
# Pinning the linker and its INCLUDE/LIB search paths here makes every
# `cargo`/`tauri` invocation use the complete BuildTools 2022 toolchain
# without needing a "Developer PowerShell for VS" shell first.
#
# If this project is built on a different machine (a normal single-VS-install
# setup, or a Linux/macOS box), this file is simply irrelevant there -
# `[target.x86_64-pc-windows-msvc]` only applies when compiling for that
# exact target. Delete this file if this machine's VS layout changes.
[target.x86_64-pc-windows-msvc]
linker = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64\link.exe'

[env]
INCLUDE = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.44.35207\include;C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\VS\include;C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\ucrt;C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\um;C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\shared;C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\winrt;C:\Program Files (x86)\Windows Kits\10\include\10.0.22621.0\cppwinrt;C:\Program Files (x86)\Windows Kits\NETFXSDK\4.8\include\um'
LIB = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.44.35207\lib\x64;C:\Program Files (x86)\Windows Kits\NETFXSDK\4.8\lib\um\x64;C:\Program Files (x86)\Windows Kits\10\lib\10.0.22621.0\ucrt\x64;C:\Program Files (x86)\Windows Kits\10\lib\10.0.22621.0\um\x64'
